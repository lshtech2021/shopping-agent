<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Shopping Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Shopping Agent</h1>
      <p id="wsStatus" class="muted">WS: …</p>
    </header>

    <section id="newSession">
      <label>购物需求</label>
      <textarea id="requirement" rows="3" placeholder="例如：帮我挑一台 5000 元内的开发笔记本"></textarea>
      <div class="sites">
        <label><input type="radio" name="site" value="jd" checked /> 京东</label>
        <label><input type="radio" name="site" value="ebay" /> eBay</label>
      </div>
      <div class="settings-controls">
        <label for="newCurrencySelect">货币</label>
        <select id="newCurrencySelect">
          <option value="">待检测</option>
          <option value="CNY" selected>CNY</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="JPY">JPY</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
          <option value="HKD">HKD</option>
          <option value="SGD">SGD</option>
          <option value="NZD">NZD</option>
        </select>
      </div>
      <div class="settings-controls">
        <label for="newMaxShippingRatio">最大运费占比</label>
        <input id="newMaxShippingRatio" type="number" min="0" max="100" step="1" value="10" />
        <span>%</span>
        <label for="newMaxShippingCost">最大运费</label>
        <input id="newMaxShippingCost" type="number" min="0" step="1" placeholder="不限制" />
        <span>会话币种</span>
      </div>
      <p class="muted">运费超过任一上限即排除；同时填写时取更严格的上限。</p>
      <button id="startBtn" type="button">开始选品</button>
    </section>

    <section id="chat" hidden>
      <div class="session-settings">
        <strong id="settingsSummary">站点: 京东 · 货币: 待检测</strong>
        <div class="settings-controls">
          <span>站点</span>
          <label><input type="radio" name="activeSite" value="jd" /> 京东</label>
          <label><input type="radio" name="activeSite" value="ebay" /> eBay</label>
          <label for="currencySelect">货币</label>
          <select id="currencySelect">
            <option value="">待检测</option>
            <option value="CNY">CNY</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
            <option value="CAD">CAD</option>
            <option value="AUD">AUD</option>
            <option value="HKD">HKD</option>
            <option value="SGD">SGD</option>
            <option value="NZD">NZD</option>
          </select>
          <label for="maxShippingRatio">最大运费占比</label>
          <input id="maxShippingRatio" type="number" min="0" max="100" step="1" />
          <span>%</span>
          <label for="maxShippingCost">最大运费</label>
          <input id="maxShippingCost" type="number" min="0" step="1" placeholder="不限制" />
          <span>会话币种</span>
        </div>
      </div>
      <div id="currencyMismatch" class="mismatch-banner" hidden>
        <strong>页面货币与会话货币不一致</strong>
        <p id="currencyMismatchText"></p>
        <div class="mismatch-actions">
          <button id="alignCurrencyBtn" type="button">我已改好网站货币</button>
          <button id="adoptCurrencyBtn" type="button">清空商品并改用页面货币</button>
        </div>
      </div>
      <p id="turnStatus" class="muted" hidden></p>
      <div id="messages"></div>
      <div class="composer">
        <input id="followup" type="text" placeholder="继续追问…" />
        <button id="sendBtn" type="button">发送</button>
        <button id="resumeBtn" type="button" hidden>继续</button>
      </div>
      <button id="resetBtn" type="button" class="linkish">新会话</button>
    </section>

    <section class="log-panel">
      <div class="log-head">
        <strong>执行日志</strong>
        <button id="clearLogsBtn" type="button" class="linkish">清空</button>
      </div>
      <pre id="execLogs" class="exec-logs"></pre>
    </section>

    <p class="muted"><a href="../options/options.html" target="_blank">设置后端地址</a></p>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
