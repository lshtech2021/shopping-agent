services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: shopping
      POSTGRES_DB: shopping_agent
    ports:
      - "5432:5432"
    volumes:
      - shopping_agent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopping_agent_pg:
