name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopping
          POSTGRES_PASSWORD: shopping
          POSTGRES_DB: shopping_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopping -d shopping_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SA_DATABASE_URL: postgresql://shopping:shopping@localhost:5432/shopping_agent_test
      SA_TEST_DATABASE_URL: postgresql://shopping:shopping@localhost:5432/shopping_agent_test
      SA_AUTO_CREATE_SCHEMA: "false"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Alembic migrations
        run: alembic upgrade head
      - name: Run pytest
        run: python -m pytest -q

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
